<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #log { width: 100%; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .USER { color: blue; }
        .BOT { color: green; }
        .system { color: gray; font-style: italic; }
    </style>
</head>
<body>
    <h1>Chat Test - Conversation {{ conversation_id }}</h1>
    <p>Esta vista se conecta al WebSocket: <code>ws://&lt;host&gt;/ws/chat/{{ conversation_id }}/</code></p>
    
    <div id="log"></div>

    <script>
        const conversationId = "{{ conversation_id }}";
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/chat/${conversationId}/`;
        
        const log = document.getElementById('log');
        
        function appendLog(text, sender) {
            const el = document.createElement('div');
            el.className = sender || 'system';
            el.textContent = text;
            log.appendChild(el);
            log.scrollTop = log.scrollHeight;
        }

        appendLog(`Connecting to ${wsUrl}...`, 'system');
        const socket = new WebSocket(wsUrl);

        socket.onopen = function(e) {
            appendLog('Connected to WebSocket.', 'system');
        };

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if (data.error) {
                appendLog(`Error: ${data.error}`, 'system');
            } else {
                appendLog(`[${data.sender}] ${data.message}`, data.sender);
            }
        };

        socket.onclose = function(e) {
            appendLog('WebSocket closed.', 'system');
        };

        socket.onerror = function(e) {
            appendLog('WebSocket error.', 'system');
        };
    </script>
</body>
</html>
